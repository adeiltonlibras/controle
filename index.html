<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Controle Financeiro</title>
<!-- Importando biblioteca de gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; padding: 20px; min-height: 100vh; }
  .container { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
  
  /* Cabeçalho */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { color: #38bdf8; font-size: 1.8rem; }
  
  /* Cartões de Resumo */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  .card { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 5px solid; }
  .card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
  .card .value { font-size: 1.8rem; font-weight: bold; }
  .card.receita { border-color: #10b981; }
  .card.despesa { border-color: #ef4444; }
  .card.saldo { border-color: #f59e0b; }
  .card.receita .value { color: #10b981; }
  .card.despesa .value { color: #ef4444; }
  .card.saldo .value { color: #f59e0b; }

  /* Layout Principal (Formulário + Gráfico) */
  .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .main-content { grid-template-columns: 1fr; } }

  /* Formulário */
  .form-container { background: #1e293b; padding: 20px; border-radius: 12px; }
  .form-title { margin-bottom: 15px; font-size: 1.1rem; color: #cbd5e1; }
  form { display: flex; flex-direction: column; gap: 12px; }
  .input-group { display: flex; gap: 10px; }
  .input-group > * { flex: 1; }
  input, select, button {
    padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: #38bdf8; }
  button {
    background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; margin-top: 5px;
  }
  button:hover { background: #0ea5e9; }

  /* Gráfico */
  .chart-container { background: #1e293b; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;}
  .chart-container h3 { margin-bottom: 15px; color: #cbd5e1; align-self: flex-start;}
  .chart-wrapper { width: 100%; max-width: 300px; }

  /* Tabela de Transações */
  .table-container { background: #1e293b; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
  th { background: #0f172a; color: #38bdf8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: #33415550; }
  
  /* Badges e Botões de Ação */
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
  .badge.receita { background: #10b98120; color: #10b981; }
  .badge.despesa { background: #ef444420; color: #ef4444; }
  .actions { display: flex; gap: 10px; }
  .btn-action { background: transparent; border: none; cursor: pointer; font-size: 1.2rem; padding: 5px; transition: 0.2s; }
  .btn-action:hover { transform: scale(1.2); }

  /* Scrollbar bonita */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">
  
  <header>
    <h1>💰 Controle Financeiro</h1>
  </header>

  <!-- Resumo -->
  <div class="cards">
    <div class="card receita">
      <h3>Receitas</h3>
      <div class="value" id="totalReceita">R$ 0,00</div>
    </div>
    <div class="card despesa">
      <h3>Despesas</h3>
      <div class="value" id="totalDespesa">R$ 0,00</div>
    </div>
    <div class="card saldo">
      <h3>Saldo Atual</h3>
      <div class="value" id="totalSaldo">R$ 0,00</div>
    </div>
  </div>

  <!-- Formulário e Gráfico -->
  <div class="main-content">
    <div class="form-container">
      <h3 class="form-title" id="formTitle">Nova Transação</h3>
      <form id="form">
        <input type="hidden" id="editId">
        <input type="text" id="descricao" placeholder="Descrição (ex: Mercado, Salário)" required>
        
        <div class="input-group">
          <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" min="0" required>
          <select id="tipo" required>
            <option value="despesa">Despesa</option>
            <option value="receita">Receita</option>
          </select>
        </div>

        <div class="input-group">
          <select id="categoria" required>
            <option value="" disabled selected>Categoria</option>
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Moradia">🏠 Moradia</option>
            <option value="Lazer">🎮 Lazer</option>
            <option value="Saúde">🏥 Saúde</option>
            <option value="Salário">💵 Salário</option>
            <option value="Outros">📦 Outros</option>
          </select>
          <input type="date" id="data" required>
        </div>

        <button type="submit" id="btnSubmit">Adicionar Transação</button>
        <button type="button" id="btnCancel" style="display:none; background:#ef4444; color:white;" onclick="cancelarEdicao()">Cancelar Edição</button>
      </form>
    </div>

    <div class="chart-container">
      <h3>Despesas por Categoria</h3>
      <div class="chart-wrapper">
        <canvas id="graficoDespesas"></canvas>
      </div>
    </div>
  </div>

  <!-- Histórico -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>

</div>

<script>
  // Estado da aplicação
  let transacoes = JSON.parse(localStorage.getItem('transacoes_v2') || '[]');
  let meuGrafico = null;

  // Elementos do DOM
  const form = document.getElementById('form');
  const lista = document.getElementById('lista');
  const formTitle = document.getElementById('formTitle');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancel = document.getElementById('btnCancel');
  const inputEditId = document.getElementById('editId');

  // Funções Utilitárias
  function salvar() { localStorage.setItem('transacoes_v2', JSON.stringify(transacoes)); }
  function formatarMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function gerarId() { return Date.now().toString(); }

  // Renderizar a Tabela e os Cartões
  function render() {
    lista.innerHTML = '';
    transacoes.sort((a, b) => new Date(b.data) - new Date(a.data));

    let receita = 0, despesa = 0;

    transacoes.forEach((t) => {
      if (t.tipo === 'receita') receita += t.valor;
      else despesa += t.valor;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(t.data + 'T00:00').toLocaleDateString('pt-BR')}</td>
        <td>${t.descricao}</td>
        <td>${t.categoria || 'Outros'}</td>
        <td><span class="badge ${t.tipo}">${t.tipo === 'receita' ? 'Receita' : 'Despesa'}</span></td>
        <td style="color: ${t.tipo === 'receita' ? '#10b981' : '#ef4444'}; font-weight: bold;">
          ${t.tipo === 'receita' ? '+' : '-'} ${formatarMoeda(t.valor)}
        </td>
        <td class="actions">
          <button class="btn-action" onclick="editar('${t.id}')" title="Editar">✏️</button>
          <button class="btn-action" onclick="remover('${t.id}')" title="Excluir">🗑️</button>
        </td>
      `;
      lista.appendChild(tr);
    });

    document.getElementById('totalReceita').textContent = formatarMoeda(receita);
    document.getElementById('totalDespesa').textContent = formatarMoeda(despesa);
    document.getElementById('totalSaldo').textContent = formatarMoeda(receita - despesa);

    atualizarGrafico();
  }

  // Renderizar o Gráfico (Chart.js)
  function atualizarGrafico() {
    const despesas = transacoes.filter(t => t.tipo === 'despesa');
    const categorias = {};
    
    despesas.forEach(t => {
      const cat = t.categoria || 'Outros';
      categorias[cat] = (categorias[cat] || 0) + t.valor;
    });

    const labels = Object.keys(categorias);
    const data = Object.values(categorias);

    if (meuGrafico) meuGrafico.destroy();

    if (labels.length === 0) {
      // Se não tiver despesas, mostra um gráfico cinza
      labels.push('Sem despesas');
      data.push(1);
    }

    const ctx = document.getElementById('graficoDespesas').getContext('2d');
    meuGrafico = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#ef4444', '#f59e0b', '#38bdf8', '#8b5cf6', '#ec4899', '#14b8a6', '#64748b'],
          borderWidth: 0,
          hoverOffset: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 20, font: { size: 12 } } }
        },
        cutout: '70%'
      }
    });
  }

  // Ações
  function remover(id) {
    if (confirm('Tem certeza que deseja excluir esta transação?')) {
      transacoes = transacoes.filter(t => t.id !== id);
      salvar();
      render();
    }
  }

  function editar(id) {
    const t = transacoes.find(t => t.id === id);
    if (!t) return;

    // Preencher o formulário
    document.getElementById('descricao').value = t.descricao;
    document.getElementById('valor').value = t.valor;
    document.getElementById('tipo').value = t.tipo;
    document.getElementById('categoria').value = t.categoria || 'Outros';
    document.getElementById('data').value = t.data;
    inputEditId.value = t.id;

    // Mudar visual do form
    formTitle.textContent = '✏️ Editando Transação';
    btnSubmit.textContent = 'Salvar Alterações';
    btnSubmit.style.background = '#f59e0b'; // Laranja para salvar
    btnCancel.style.display = 'block';

    // Rolar para o topo
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelarEdicao() {
    form.reset();
    inputEditId.value = '';
    formTitle.textContent = 'Nova Transação';
    btnSubmit.textContent = 'Adicionar Transação';
    btnSubmit.style.background = '#38bdf8';
    btnCancel.style.display = 'none';
    document.getElementById('data').value = new Date().toISOString().split('T')[0];
  }

  // Submit do Formulário (Adicionar ou Salvar Edição)
  form.addEventListener('submit', e => {
    e.preventDefault();
    
    const novaTransacao = {
      id: inputEditId.value || gerarId(),
      descricao: document.getElementById('descricao').value,
      valor: parseFloat(document.getElementById('valor').value),
      tipo: document.getElementById('tipo').value,
      categoria: document.getElementById('categoria').value,
      data: document.getElementById('data').value
    };

    if (inputEditId.value) {
      // Editando
      const index = transacoes.findIndex(t => t.id === inputEditId.value);
      transacoes[index] = novaTransacao;
      cancelarEdicao();
    } else {
      // Adicionando
      transacoes.push(novaTransacao);
      form.reset();
      document.getElementById('data').value = new Date().toISOString().split('T')[0];
    }

    salvar();
    render();
  });

  // Inicialização
  document.getElementById('data').value = new Date().toISOString().split('T')[0];
  render();
</script>
</body>
</html>
