<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro Nuvem</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
  
  /* TELA DE LOGIN */
  #telaLogin { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
  .login-box { background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .login-box h2 { text-align: center; color: #38bdf8; margin-bottom: 10px; }
  .login-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  .login-box button { background: #38bdf8; color: #0f172a; font-weight: bold; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
  .login-box button:hover { background: #0ea5e9; }
  .btn-link { background: transparent !important; color: #94a3b8 !important; font-weight: normal !important; margin-top: 5px !important; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
  
  /* SITE */
  #siteContainer { display: none; max-width: 1200px; margin: 0 auto; width: 100%; grid-gap: 20px; display: none; flex-direction: column; }
  
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 15px;}
  h1 { color: #38bdf8; font-size: 1.8rem; }
  .header-controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap;}
  
  /* Filtro de Mês */
  .filtro-mes { background: #1e293b; padding: 8px 15px; border-radius: 8px; border: 1px solid #334155; color: #38bdf8; font-weight: bold; cursor: pointer; }
  .filtro-mes:focus { outline: none; border-color: #38bdf8; }

  .user-info { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; }
  .status-nuvem { background: #10b98120; color: #10b981; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
  .btn-sair { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  
  /* Cartões Resumo */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  .card { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 5px solid; }
  .card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
  .card .value { font-size: 1.5rem; font-weight: bold; }
  .card.receita { border-color: #10b981; }
  .card.despesa { border-color: #ef4444; }
  .card.saldo { border-color: #f59e0b; }
  .card.pendente { border-color: #8b5cf6; } /* Roxo para pendentes */
  .card.receita .value { color: #10b981; }
  .card.despesa .value { color: #ef4444; }
  .card.saldo .value { color: #f59e0b; }
  .card.pendente .value { color: #8b5cf6; }

  .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .main-content { grid-template-columns: 1fr; } }

  /* Formulário */
  .form-container { background: #1e293b; padding: 20px; border-radius: 12px; }
  .form-title { margin-bottom: 15px; font-size: 1.1rem; color: #cbd5e1; }
  form { display: flex; flex-direction: column; gap: 12px; }
  .input-group { display: flex; gap: 10px; }
  .input-group > * { flex: 1; }
  input, select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; width: 100%; }
  input:focus, select:focus { outline: none; border-color: #38bdf8; }
  
  .btn-add { background: #38bdf8; color: #0f172a; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; border: none; transition: 0.2s; margin-top: 5px; }
  .btn-add:hover { background: #0ea5e9; }
  .btn-add:disabled { background: #64748b; cursor: not-allowed; }

  /* Gráfico */
  .chart-container { background: #1e293b; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;}
  .chart-container h3 { margin-bottom: 15px; color: #cbd5e1; align-self: flex-start;}
  .chart-wrapper { width: 100%; max-width: 250px; }

  /* Tabela */
  .table-container { background: #1e293b; border-radius: 12px; overflow-x: auto; margin-bottom: 20px;}
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem;}
  th { background: #0f172a; color: #38bdf8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: #33415550; }
  
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
  .badge.receita { background: #10b98120; color: #10b981; }
  .badge.despesa { background: #ef444420; color: #ef4444; }
  .badge.pago { background: #38bdf820; color: #38bdf8; }
  .badge.pendente { background: #8b5cf620; color: #8b5cf6; }

  .actions { display: flex; gap: 10px; }
  .btn-action { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px; transition: 0.2s; }
  .btn-action:hover { transform: scale(1.2); }
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin">
  <div class="login-box">
    <h2>💰 Controle Financeiro</h2>
    <input type="email" id="email" placeholder="Seu e-mail" required>
    <input type="password" id="senha" placeholder="Sua senha (min. 6 caracteres)" required>
    <button onclick="fazerLogin()" id="btnLogin">Entrar</button>
    <button class="btn-link" onclick="fazerCadastro()" id="btnCadastro">Não tem conta? Criar uma agora.</button>
  </div>
</div>

<!-- SITE PRINCIPAL -->
<div id="siteContainer" class="container">
  <header>
    <h1>💰 Controle Financeiro</h1>
    <div class="header-controls">
      <input type="month" id="filtroMes" class="filtro-mes" onchange="render()">
      <span id="emailUsuario" style="color:#94a3b8; font-size: 0.9rem;"></span>
      <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>
  </header>

  <!-- Cartões Resumo -->
  <div class="cards">
    <div class="card receita">
      <h3>Receitas Recebidas</h3>
      <div class="value" id="totalReceita">R$ 0,00</div>
    </div>
    <div class="card despesa">
      <h3>Despesas Pagas</h3>
      <div class="value" id="totalDespesa">R$ 0,00</div>
    </div>
    <div class="card saldo">
      <h3>Saldo em Conta</h3>
      <div class="value" id="totalSaldo">R$ 0,00</div>
    </div>
    <div class="card pendente">
      <h3>A Pagar / Receber</h3>
      <div class="value" id="totalPendente">R$ 0,00</div>
    </div>
  </div>

  <div class="main-content">
    <!-- Formulário -->
    <div class="form-container">
      <h3 class="form-title" id="formTitle">Nova Transação</h3>
      <form id="form">
        <input type="hidden" id="editId">
        <input type="text" id="descricao" placeholder="Descrição (ex: Mercado, Salário)" required>
        
        <div class="input-group">
          <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" min="0" required>
          <select id="tipo" required>
            <option value="despesa">Despesa</option>
            <option value="receita">Renda</option>
          </select>
        </div>

        <div class="input-group">
          <select id="conta" required>
            <option value="" disabled selected>Conta / Cartão</option>
            <optgroup label="Contas Bancárias">
              <option value="Itaú">Itaú</option>
              <option value="Nubank">Nubank</option>
              <option value="Banco do Brasil">Banco do Brasil</option>
              <option value="Santander">Santander</option>
              <option value="Caixa">Caixa</option>
              <option value="Dinheiro">Dinheiro Físico</option>
            </optgroup>
            <optgroup label="Cartões de Crédito">
              <option value="Cartão Riachuelo">Cartão Riachuelo</option>
              <option value="Cartão Nubank">Cartão Nubank</option>
              <option value="Cartão Bradescard">Cartão Bradescard</option>
              <option value="Cartão Itaú">Cartão Itaú</option>
              <option value="Cartão Açadão">Cartão Açadão</option>
            </optgroup>
            <option value="Outro">Outro</option>
          </select>

          <select id="status" required>
            <option value="Pago" selected>Pago / Recebido</option>
            <option value="Pendente">Pendente / Não Pago</option>
          </select>
        </div>

        <div class="input-group">
          <select id="categoria" required>
            <option value="" disabled selected>Categoria</option>
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Moradia">🏠 Moradia</option>
            <option value="Lazer">🎮 Lazer</option>
            <option value="Saúde">🏥 Saúde</option>
            <option value="Salário">💵 Salário / Renda</option>
            <option value="Fatura">💳 Fatura de Cartão</option>
            <option value="Outros">📦 Outros</option>
          </select>
          <input type="date" id="data" required>
        </div>

        <button type="submit" class="btn-add" id="btnSubmit">Adicionar Transação</button>
        <button type="button" id="btnCancel" style="display:none; background:#ef4444; color:white; padding:12px; border-radius:8px; border:none; cursor:pointer;" onclick="cancelarEdicao()">Cancelar Edição</button>
      </form>
    </div>

    <!-- Gráfico -->
    <div class="chart-container">
      <h3>Despesas por Categoria</h3>
      <div class="chart-wrapper">
        <canvas id="graficoDespesas"></canvas>
      </div>
    </div>
  </div>

  <!-- Tabela -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Conta / Cartão</th>
          <th>Status</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC_1Ly94lTcBA2y2m3Gx6wOimBKYoOTgdY",
    authDomain: "financas-adeilton.firebaseapp.com",
    projectId: "financas-adeilton",
    storageBucket: "financas-adeilton.firebasestorage.app",
    messagingSenderId: "951516511330",
    appId: "1:951516511330:web:2b2ddf80bc7cc068f2253b",
    measurementId: "G-3KWKWZQGDL"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let usuarioId = null;
  let transacoes = [];
  let meuGrafico = null;
  let unsubscribeSnapshot = null;

  const telaLogin = document.getElementById('telaLogin');
  const siteContainer = document.getElementById('siteContainer');
  const emailUsuario = document.getElementById('emailUsuario');
  const form = document.getElementById('form');
  const lista = document.getElementById('lista');
  const formTitle = document.getElementById('formTitle');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancel = document.getElementById('btnCancel');
  const inputEditId = document.getElementById('editId');
  const filtroMes = document.getElementById('filtroMes');

  function formatarMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

  // --- AUTENTICAÇÃO ---
  window.fazerLogin = async function() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    if(!email || !senha) return alert("Preencha e-mail e senha!");
    try { await signInWithEmailAndPassword(auth, email, senha); } 
    catch (error) { alert("Erro ao entrar: " + error.message); }
  }

  window.fazerCadastro = async function() {
    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;
    if(!email || !senha) return alert("Preencha e-mail e senha!");
    try { await createUserWithEmailAndPassword(auth, email, senha); alert("Conta criada!"); } 
    catch (error) { alert("Erro ao criar conta: " + error.message); }
  }

  window.fazerLogout = function() {
    if(confirm("Deseja sair da sua conta?")) { signOut(auth); }
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      usuarioId = user.uid;
      telaLogin.style.display = 'none';
      siteContainer.style.display = 'flex';
      emailUsuario.textContent = user.email;
      
      // Define o mês atual no filtro
      const hoje = new Date();
      const mesAtual = hoje.toISOString().slice(0, 7); // formato YYYY-MM
      filtroMes.value = mesAtual;

      carregarDados();
    } else {
      telaLogin.style.display = 'flex';
      siteContainer.style.display = 'none';
      if(unsubscribeSnapshot) unsubscribeSnapshot();
      transacoes = [];
    }
  });

  function carregarDados() {
    const transacoesRef = collection(db, "usuarios", usuarioId, "transacoes");
    if (unsubscribeSnapshot) unsubscribeSnapshot();

    unsubscribeSnapshot = onSnapshot(transacoesRef, (snapshot) => {
      transacoes = [];
      snapshot.forEach((doc) => {
        transacoes.push({ id: doc.id, ...doc.data() });
      });
      render();
    }, (error) => alert("Erro ao ler dados."));
  }

  // --- RENDERIZAÇÃO ---
  function render() {
    lista.innerHTML = '';
    
    // Filtro de Mês
    const mesSelecionado = filtroMes.value; 
    
    // Filtra as transações pelo mês selecionado (se houver)
    const transacoesFiltradas = transacoes.filter(t => {
      if (!mesSelecionado) return true;
      return t.data.startsWith(mesSelecionado);
    });

    transacoesFiltradas.sort((a, b) => new Date(b.data) - new Date(a.data));

    let receita = 0, despesa = 0, pendente = 0;

    transacoesFiltradas.forEach((t) => {
      // Calcula os totais
      if (t.status === 'Pendente') {
        pendente += (t.tipo === 'receita' ? t.valor : -t.valor);
      } else {
        if (t.tipo === 'receita') receita += t.valor;
        else despesa += t.valor;
      }

      // Renderiza a linha na tabela
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(t.data + 'T00:00').toLocaleDateString('pt-BR')}</td>
        <td>${t.descricao}</td>
        <td>${t.categoria || 'Outros'}</td>
        <td>${t.conta || 'Não informada'}</td>
        <td><span class="badge ${t.status === 'Pendente' ? 'pendente' : 'pago'}">${t.status || 'Pago'}</span></td>
        <td style="color: ${t.tipo === 'receita' ? '#10b981' : '#ef4444'}; font-weight: bold;">
          ${t.tipo === 'receita' ? '+' : '-'} ${formatarMoeda(t.valor)}
        </td>
        <td class="actions">
          <button class="btn-action" onclick="editar('${t.id}')" title="Editar">✏️</button>
          <button class="btn-action" onclick="remover('${t.id}')" title="Excluir">🗑️</button>
        </td>
      `;
      lista.appendChild(tr);
    });

    document.getElementById('totalReceita').textContent = formatarMoeda(receita);
    document.getElementById('totalDespesa').textContent = formatarMoeda(despesa);
    document.getElementById('totalSaldo').textContent = formatarMoeda(receita - despesa);
    document.getElementById('totalPendente').textContent = formatarMoeda(pendente);

    atualizarGrafico(transacoesFiltradas);
  }

  function atualizarGrafico(transacoesFiltradas) {
    const despesas = transacoesFiltradas.filter(t => t.tipo === 'despesa');
    const categorias = {};
    
    despesas.forEach(t => {
      const cat = t.categoria || 'Outros';
      categorias[cat] = (categorias[cat] || 0) + t.valor;
    });

    const labels = Object.keys(categorias);
    const data = Object.values(categorias);

    if (meuGrafico) meuGrafico.destroy();

    if (labels.length === 0) { labels.push('Sem despesas'); data.push(1); }

    const ctx = document.getElementById('graficoDespesas').getContext('2d');
    meuGrafico = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#ef4444', '#f59e0b', '#38bdf8', '#8b5cf6', '#ec4899', '#14b8a6', '#64748b'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 10, boxWidth: 12 } } },
        cutout: '70%'
      }
    });
  }

  // --- AÇÕES CRUD ---
  window.remover = async function(id) {
    if (confirm('Excluir esta transação?')) {
      await deleteDoc(doc(db, "usuarios", usuarioId, "transacoes", id));
    }
  }

  window.editar = function(id) {
    const t = transacoes.find(t => t.id === id);
    if (!t) return;

    document.getElementById('descricao').value = t.descricao;
    document.getElementById('valor').value = t.valor;
    document.getElementById('tipo').value = t.tipo;
    document.getElementById('conta').value = t.conta || 'Outro';
    document.getElementById('status').value = t.status || 'Pago';
    document.getElementById('categoria').value = t.categoria || 'Outros';
    document.getElementById('data').value = t.data;
    inputEditId.value = t.id;

    formTitle.textContent = '✏️ Editando Transação';
    btnSubmit.textContent = 'Salvar Alterações';
    btnSubmit.style.background = '#f59e0b';
    btnCancel.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.cancelarEdicao = function() {
    form.reset();
    inputEditId.value = '';
    formTitle.textContent = 'Nova Transação';
    btnSubmit.textContent = 'Adicionar Transação';
    btnSubmit.style.background = '#38bdf8';
    btnCancel.style.display = 'none';
    
    // Reseta a data para hoje
    document.getElementById('data').value = new Date().toISOString().split('T')[0];
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!usuarioId) return;
    btnSubmit.disabled = true;

    const dados = {
      descricao: document.getElementById('descricao').value,
      valor: parseFloat(document.getElementById('valor').value),
      tipo: document.getElementById('tipo').value,
      conta: document.getElementById('conta').value,
      status: document.getElementById('status').value,
      categoria: document.getElementById('categoria').value,
      data: document.getElementById('data').value
    };

    try {
      if (inputEditId.value) {
        await updateDoc(doc(db, "usuarios", usuarioId, "transacoes", inputEditId.value), dados);
        cancelarEdicao();
      } else {
        await addDoc(collection(db, "usuarios", usuarioId, "transacoes"), dados);
        form.reset();
        document.getElementById('data').value = new Date().toISOString().split('T')[0];
      }
    } catch (error) {
      alert("Erro ao salvar: " + error.message);
    } finally {
      btnSubmit.disabled = false;
    }
  });

  document.getElementById('data').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
